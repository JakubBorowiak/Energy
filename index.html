<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Energy — nawyki & radar</title>
<style>
  :root {
    --bg: #0e1116;
    --surface: #171b22;
    --surface-2: #1e232c;
    --border: #2a303b;
    --text: #e7ecf3;
    --muted: #8a94a6;
    --accent: #6ea8fe;
    --good: #3ecf8e;
    --bad: #ff6b6b;
    --warn: #ffb454;
    --purple: #b48ef2;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 84px;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; }
  .app-header {
    padding: 20px 18px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-header h1 { font-size: 22px; letter-spacing: -0.5px; }
  .app-header .date { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .daynav { display:flex; gap:6px; align-items:center; }
  .daynav button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .daynav button:active { transform: scale(0.94); }
  section { padding: 8px 14px 14px; }
  .section-title {
    display:flex; align-items:center; justify-content:space-between;
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 14px 4px 8px;
  }
  .section-title .add {
    color: var(--accent); cursor: pointer; font-size: 20px; line-height: 1;
    background: none; border: none;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px; margin-bottom: 10px;
  }
  .habit {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px; border-radius: 12px; cursor: pointer; user-select: none;
  }
  .habit:active { background: var(--surface-2); }
  .check {
    width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex: 0 0 auto;
    font-size: 16px; color: #fff; transition: all .12s;
  }
  .habit.done .check { background: var(--good); border-color: var(--good); }
  .habit.bad .check { border-color: var(--bad); }
  .habit.bad.slip .check { background: var(--bad); border-color: var(--bad); }
  .habit-body { flex: 1; min-width: 0; }
  .habit-name { font-size: 15px; font-weight: 600; }
  .habit-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .streak { font-size: 12px; color: var(--warn); font-weight: 700; white-space: nowrap; }
  .habit-menu { color: var(--muted); font-size: 18px; padding: 4px 6px; background:none;border:none;cursor:pointer;}
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 4px; margin-top: 7px; overflow: hidden;}
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; }

  /* Supplements */
  .supp-head { display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; }
  .supp-list { border-top: 1px solid var(--border); padding: 4px 8px 8px; }
  .supp-row { display:flex; align-items:center; gap:10px; padding:9px 6px; }
  .supp-check { width:22px;height:22px;border-radius:7px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer;flex:0 0 auto;}
  .supp-row.taken .supp-check{background:var(--good);border-color:var(--good);}
  .supp-name{flex:1;font-size:14px;}
  .supp-row:not(.taken) .supp-name{color:var(--muted);text-decoration:line-through;}
  .supp-time{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:4px 6px;font-size:12px;}
  .supp-add{color:var(--accent);font-size:13px;padding:8px 6px;cursor:pointer;}

  /* Ratings */
  .rating { padding: 12px; }
  .rating-label { display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; }
  .rating-label b { color: var(--accent); }
  input[type=range]{ width:100%; accent-color: var(--accent); }
  .num-input{ display:flex; gap:8px; align-items:center; }
  .num-input input{ width:70px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:8px; font-size:15px; }
  .field-note{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px; font-size:14px; resize:vertical; min-height:44px; font-family:inherit;}

  /* Incidents */
  .incident{ display:flex; align-items:center; gap:10px; padding:11px 12px; }
  .incident .ico{ font-size:20px; }
  .incident .meta{ flex:1; }
  .incident .meta .t{ font-size:14px; font-weight:600; }
  .incident .meta .s{ font-size:12px; color:var(--muted); }
  .del{ color:var(--bad); background:none;border:none;cursor:pointer;font-size:16px;padding:4px;}

  /* Tabbar */
  .tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:560px; background:rgba(20,24,31,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--border); display:flex; padding:8px 0 20px; }
  .tab{ flex:1; text-align:center; color:var(--muted); font-size:11px; cursor:pointer; background:none;border:none;}
  .tab .i{ font-size:20px; display:block; }
  .tab.active{ color:var(--accent); }

  .view{ display:none; }
  .view.active{ display:block; }

  /* Stats */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .stat-box .big{ font-size:26px; font-weight:800; }
  .stat-box .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal .cell{ aspect-ratio:1; border-radius:6px; background:var(--surface-2); }
  .bars{ display:flex; align-items:flex-end; gap:3px; height:90px; }
  .bars .b{ flex:1; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; opacity:.85;}
  .hourlabels{ display:flex; justify-content:space-between; font-size:9px; color:var(--muted); margin-top:4px;}
  .corr{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
  .corr .headline{ font-size:14px; line-height:1.45; }
  .corr .conf{ display:inline-block; font-size:11px; padding:3px 8px; border-radius:20px; margin-top:8px; font-weight:700;}
  .conf.low{ background:rgba(255,107,107,.15); color:var(--bad);}
  .conf.mid{ background:rgba(255,180,84,.15); color:var(--warn);}
  .conf.high{ background:rgba(62,207,142,.15); color:var(--good);}
  .ai-btn{ width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--accent)); color:#fff; font-size:15px; font-weight:700;
    margin:6px 0 14px;}
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:24px 12px; }

  /* Modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end;
    justify-content:center; z-index:50;}
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:20px 18px 30px; border:1px solid var(--border);}
  .modal h3{ margin-bottom:14px; }
  .modal label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .modal input, .modal select{ width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:11px; font-size:15px; font-family:inherit;}
  .modal .row{ display:flex; gap:10px; }
  .modal .row > *{ flex:1; }
  .btns{ display:flex; gap:10px; margin-top:18px; }
  .btns button{ flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer;}
  .btns .primary{ background:var(--accent); color:#08101f; }
  .btns .ghost{ background:var(--surface-2); color:var(--text); }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--muted); font-size:13px; cursor:pointer;}
  .seg button.on{ background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:700;}
  .toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface-2);
    border:1px solid var(--border); padding:10px 16px; border-radius:20px; font-size:13px; opacity:0;
    transition:opacity .2s; pointer-events:none; z-index:60;}
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>Energy</h1>
    <div class="date" id="dateLabel"></div>
  </div>
  <div class="daynav">
    <button id="prevDay">‹</button>
    <button id="todayBtn" style="width:auto;padding:0 12px;font-size:13px;">dziś</button>
    <button id="nextDay">›</button>
  </div>
</div>

<!-- ============ WIDOK: DZIŚ ============ -->
<div class="view active" id="view-today">

  <section>
    <div class="section-title">Nawyki dzienne <button class="add" data-add="good">＋</button></div>
    <div class="card" id="goodHabits"></div>

    <div class="section-title">Do rzucenia <button class="add" data-add="bad">＋</button></div>
    <div class="card" id="badHabits"></div>

    <div class="section-title">Tygodniowe <button class="add" data-add="weekly">＋</button></div>
    <div class="card" id="weeklyHabits"></div>

    <div class="section-title">Suplementy <button class="add" data-add="supp">＋</button></div>
    <div class="card" id="suppCard"></div>

    <div class="section-title">Ocena dnia</div>
    <div class="card" id="ratingsCard"></div>

    <div class="section-title">Incydenty (scroll / dopamina) <button class="add" data-add="incident">＋</button></div>
    <div class="card" id="incidentsCard"></div>
  </section>
</div>

<!-- ============ WIDOK: STATYSTYKI ============ -->
<div class="view" id="view-stats">
  <section>
    <div class="stat-grid" id="statGrid"></div>

    <div class="section-title">Aktywność (30 dni)</div>
    <div class="stat-box"><div class="cal" id="calGrid"></div></div>

    <div class="section-title">Scrollowanie wg godziny</div>
    <div class="stat-box">
      <div class="bars" id="hourBars"></div>
      <div class="hourlabels"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
    </div>

    <div class="section-title">Radar korelacji (automat)</div>
    <div id="corrList"></div>

    <button class="ai-btn" id="aiBtn">✨ Przeanalizuj z AI (głębiej)</button>
    <div id="aiResult"></div>
  </section>
</div>

<!-- Tabbar -->
<div class="tabbar">
  <button class="tab active" data-view="today"><span class="i">✅</span>Dziś</button>
  <button class="tab" data-view="stats"><span class="i">📊</span>Statystyki</button>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Energy — prototyp. Dane trzymane w localStorage.
   Model danych:
   state.habits[] = {id,type:'good'|'bad'|'weekly',name,unit?,target?(weekly)}
   state.supps[]  = {id,name,defaultTime}
   state.logs[date] = {
      habits:{habitId:true|false|count}, weekly liczony z historii
      supps:{suppId:{taken:bool,time:"HH:MM"}}, extras:[{name,time}]
      ratings:{sleepH,sleepTime,work,energy,self,note}
      incidents:[{id,name,minutes,time,trigger}]
   }
   ============================================================ */

const DOPAMINE_PRESETS = ["Instagram","TikTok","YouTube","Reddit","X/Twitter","Porno","Gry","Jedzenie"];
const TRIGGERS = ["nuda","stres","unikanie zadania","zmęczenie","samotność","nawyk/automat","nagroda"];

const todayISO = () => new Date().toISOString().slice(0,10);
let currentDate = todayISO();

const DEFAULT_STATE = {
  habits: [
    {id:'h1',type:'good',name:'Trening / ruch'},
    {id:'h2',type:'good',name:'Czytanie 20 min'},
    {id:'h3',type:'good',name:'Bez telefonu pierwsza godzina'},
    {id:'b1',type:'bad',name:'Bezmyślne scrollowanie'},
    {id:'b2',type:'bad',name:'Cukier / fast food'},
    {id:'w1',type:'weekly',name:'Siłownia',target:4},
  ],
  supps: [
    {id:'s1',name:'Magnez',defaultTime:'21:00'},
    {id:'s2',name:'Omega-3',defaultTime:'08:00'},
    {id:'s3',name:'Ashwagandha',defaultTime:'21:00'},
    {id:'s4',name:'Witamina D',defaultTime:'08:00'},
  ],
  logs: {}
};

let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem('energy_v1'));
    if(s && s.habits) return s; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){ localStorage.setItem('energy_v1', JSON.stringify(state)); }

function logFor(date){
  if(!state.logs[date]) state.logs[date] = {habits:{},supps:{},extras:[],ratings:{},incidents:[]};
  const l = state.logs[date];
  l.habits ||= {}; l.supps ||= {}; l.extras ||= []; l.ratings ||= {}; l.incidents ||= [];
  return l;
}
const uid = () => Math.random().toString(36).slice(2,9);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400); }
function nowHM(){ const d=new Date(); return d.toTimeString().slice(0,5); }

/* ---------- STREAKI ---------- */
function goodStreak(habitId){
  let n=0; let d=new Date(currentDate);
  for(let i=0;i<400;i++){
    const iso=d.toISOString().slice(0,10);
    const l=state.logs[iso];
    if(l && l.habits && l.habits[habitId]===true) n++;
    else if(iso!==todayISO()) break; else if(iso===todayISO()) { d.setDate(d.getDate()-1); continue; }
    d.setDate(d.getDate()-1);
  }
  return n;
}
function badCleanStreak(habitId){
  let n=0; let d=new Date(currentDate);
  for(let i=0;i<400;i++){
    const iso=d.toISOString().slice(0,10);
    const l=state.logs[iso];
    // "czysto" = brak zaznaczenia że uległem
    if(l && l.habits && l.habits[habitId]===true){ break; } // true = uległem (slip)
    n++; d.setDate(d.getDate()-1);
    if(n>365) break;
  }
  return n;
}
function weeklyCount(habitId){
  let c=0; let d=new Date(currentDate);
  for(let i=0;i<7;i++){
    const iso=d.toISOString().slice(0,10);
    const l=state.logs[iso];
    if(l && l.habits && l.habits[habitId]===true) c++;
    d.setDate(d.getDate()-1);
  }
  return c;
}

/* ---------- RENDER: DZIŚ ---------- */
function render(){
  const d=new Date(currentDate);
  const opts={weekday:'long',day:'numeric',month:'long'};
  let lbl=d.toLocaleDateString('pl-PL',opts);
  if(currentDate===todayISO()) lbl='Dziś · '+lbl;
  document.getElementById('dateLabel').textContent=lbl.charAt(0).toUpperCase()+lbl.slice(1);

  const l=logFor(currentDate);

  // GOOD
  const gc=document.getElementById('goodHabits'); gc.innerHTML='';
  state.habits.filter(h=>h.type==='good').forEach(h=>{
    const done=l.habits[h.id]===true;
    const s=goodStreak(h.id);
    gc.appendChild(habitEl(h,done,false,s?`🔥 ${s}`:''));
  });
  if(!gc.children.length) gc.innerHTML='<div class="empty">Brak — dodaj ＋</div>';

  // BAD
  const bc=document.getElementById('badHabits'); bc.innerHTML='';
  state.habits.filter(h=>h.type==='bad').forEach(h=>{
    const slip=l.habits[h.id]===true;
    const clean=badCleanStreak(h.id);
    bc.appendChild(habitEl(h,false,true,slip?'uległem':`✨ ${clean} dni czysto`,slip));
  });
  if(!bc.children.length) bc.innerHTML='<div class="empty">Brak — dodaj ＋</div>';

  // WEEKLY
  const wc=document.getElementById('weeklyHabits'); wc.innerHTML='';
  state.habits.filter(h=>h.type==='weekly').forEach(h=>{
    const done=l.habits[h.id]===true;
    const cnt=weeklyCount(h.id);
    const el=habitEl(h,done,false,`${cnt}/${h.target} w tyg.`);
    const track=document.createElement('div'); track.className='progress-track';
    const fill=document.createElement('div'); fill.className='progress-fill';
    fill.style.width=Math.min(100,cnt/h.target*100)+'%'; track.appendChild(fill);
    el.querySelector('.habit-body').appendChild(track);
    wc.appendChild(el);
  });
  if(!wc.children.length) wc.innerHTML='<div class="empty">Brak — dodaj ＋</div>';

  renderSupps(l);
  renderRatings(l);
  renderIncidents(l);
  save();
}

function habitEl(h,done,bad,subText,slip){
  const el=document.createElement('div');
  el.className='habit'+(done?' done':'')+(bad?' bad':'')+(slip?' slip':'');
  el.innerHTML=`<div class="check">${(done||slip)?'✓':''}</div>
    <div class="habit-body"><div class="habit-name">${esc(h.name)}</div>
    <div class="habit-sub">${subText}</div></div>
    <button class="habit-menu">⋯</button>`;
  el.addEventListener('click',(e)=>{
    if(e.target.classList.contains('habit-menu')) return;
    const l=logFor(currentDate);
    l.habits[h.id]=!(l.habits[h.id]===true);
    render();
    if(bad && l.habits[h.id]) toast('Zanotowane. Bez oceniania — jutro nowy dzień 💪');
  });
  el.querySelector('.habit-menu').addEventListener('click',(e)=>{e.stopPropagation();editHabit(h);});
  return el;
}

/* ---------- SUPLEMENTY (stack) ---------- */
function renderSupps(l){
  const card=document.getElementById('suppCard');
  const allTaken=state.supps.length>0 && state.supps.every(s=>l.supps[s.id]?.taken);
  card.innerHTML='';
  const head=document.createElement('div');
  head.className='supp-head';
  const takenCount=state.supps.filter(s=>l.supps[s.id]?.taken).length + l.extras.length;
  head.innerHTML=`<div class="check ${allTaken?'':''}" style="${allTaken?'background:var(--good);border-color:var(--good)':''}">${allTaken?'✓':''}</div>
    <div class="habit-body"><div class="habit-name">Stack suplementów</div>
    <div class="habit-sub">${takenCount>0?takenCount+' wzięte dziś':'Kliknij, by wziąć cały stack'}</div></div>
    <span style="color:var(--muted);font-size:18px;">▾</span>`;
  head.addEventListener('click',()=>{
    const l=logFor(currentDate);
    const anyMissing=state.supps.some(s=>!l.supps[s.id]?.taken);
    state.supps.forEach(s=>{
      l.supps[s.id]={taken:anyMissing, time:l.supps[s.id]?.time || s.defaultTime};
    });
    toast(anyMissing?'Cały stack wzięty ✓':'Odznaczono stack');
    render();
  });
  card.appendChild(head);

  const list=document.createElement('div'); list.className='supp-list';
  state.supps.forEach(s=>{
    const st=l.supps[s.id]||{taken:false,time:s.defaultTime};
    const row=document.createElement('div'); row.className='supp-row'+(st.taken?' taken':'');
    row.innerHTML=`<div class="supp-check">${st.taken?'✓':''}</div>
      <div class="supp-name">${esc(s.name)}</div>
      <input class="supp-time" type="time" value="${st.time||s.defaultTime}">
      <button class="habit-menu" style="font-size:15px;">⋯</button>`;
    row.querySelector('.supp-check').addEventListener('click',()=>{
      const l=logFor(currentDate);
      const cur=l.supps[s.id]?.taken||false;
      l.supps[s.id]={taken:!cur,time:l.supps[s.id]?.time||s.defaultTime}; render();
    });
    row.querySelector('.supp-time').addEventListener('change',(e)=>{
      const l=logFor(currentDate);
      l.supps[s.id]={taken:l.supps[s.id]?.taken||false,time:e.target.value}; save();
    });
    row.querySelector('.habit-menu').addEventListener('click',()=>editSupp(s));
    list.appendChild(row);
  });
  // extras
  l.extras.forEach((ex,i)=>{
    const row=document.createElement('div'); row.className='supp-row taken';
    row.innerHTML=`<div class="supp-check">✓</div>
      <div class="supp-name">${esc(ex.name)} <span style="color:var(--purple);font-size:11px;">dodatkowy</span></div>
      <span class="supp-time">${ex.time}</span>
      <button class="del">✕</button>`;
    row.querySelector('.del').addEventListener('click',()=>{
      logFor(currentDate).extras.splice(i,1); render();
    });
    list.appendChild(row);
  });
  const add=document.createElement('div'); add.className='supp-add';
  add.textContent='＋ dodaj suplement tylko na dziś';
  add.addEventListener('click',()=>{
    openModal('Dodatkowy suplement (dziś)',`
      <label>Nazwa</label><input id="mName" placeholder="np. Cynk">
      <label>Godzina</label><input id="mTime" type="time" value="${nowHM()}">`,
      ()=>{ const n=val('mName'); if(!n) return false;
        logFor(currentDate).extras.push({name:n,time:val('mTime')}); render(); });
  });
  list.appendChild(add);
  card.appendChild(list);
}

/* ---------- OCENY DNIA ---------- */
const RATING_DEFS=[
  {key:'sleepH',label:'Sen (godziny)',type:'num',min:0,max:14,step:.5,def:7},
  {key:'sleepTime',label:'Pójście spać',type:'time'},
  {key:'work',label:'Jakość pracy',type:'range',def:5},
  {key:'energy',label:'Energia / samopoczucie',type:'range',def:5},
  {key:'self',label:'Ogólna ocena siebie',type:'range',def:5},
];
function renderRatings(l){
  const c=document.getElementById('ratingsCard'); c.innerHTML='';
  RATING_DEFS.forEach(r=>{
    const wrap=document.createElement('div'); wrap.className='rating';
    if(r.type==='range'){
      const v=l.ratings[r.key]??r.def;
      wrap.innerHTML=`<div class="rating-label"><span>${r.label}</span><b>${v}/10</b></div>
        <input type="range" min="1" max="10" value="${v}">`;
      wrap.querySelector('input').addEventListener('input',(e)=>{
        logFor(currentDate).ratings[r.key]=+e.target.value;
        wrap.querySelector('b').textContent=e.target.value+'/10'; save();
      });
    } else if(r.type==='num'){
      const v=l.ratings[r.key]??'';
      wrap.innerHTML=`<div class="rating-label"><span>${r.label}</span></div>
        <div class="num-input"><input type="number" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" placeholder="${r.def}"> <span style="color:var(--muted)">h</span></div>`;
      wrap.querySelector('input').addEventListener('change',(e)=>{
        logFor(currentDate).ratings[r.key]=e.target.value===''?null:+e.target.value; save();
      });
    } else if(r.type==='time'){
      const v=l.ratings[r.key]??'';
      wrap.innerHTML=`<div class="rating-label"><span>${r.label}</span></div>
        <div class="num-input"><input type="time" value="${v}" style="width:auto;"></div>`;
      wrap.querySelector('input').addEventListener('change',(e)=>{
        logFor(currentDate).ratings[r.key]=e.target.value; save();
      });
    }
    c.appendChild(wrap);
  });
  const noteWrap=document.createElement('div'); noteWrap.className='rating';
  noteWrap.innerHTML=`<div class="rating-label"><span>Notatka dnia</span></div>
    <textarea class="field-note" placeholder="Co się dziś działo? Jak się czułeś?">${esc(l.ratings.note||'')}</textarea>`;
  noteWrap.querySelector('textarea').addEventListener('input',(e)=>{
    logFor(currentDate).ratings.note=e.target.value; save();
  });
  c.appendChild(noteWrap);
}

/* ---------- INCYDENTY ---------- */
function renderIncidents(l){
  const c=document.getElementById('incidentsCard'); c.innerHTML='';
  if(!l.incidents.length){ c.innerHTML='<div class="empty">Nic dziś. Dodaj ＋ gdy się złapiesz na scrollowaniu.</div>'; return; }
  l.incidents.forEach((inc,i)=>{
    const row=document.createElement('div'); row.className='incident';
    row.innerHTML=`<span class="ico">📱</span>
      <div class="meta"><div class="t">${esc(inc.name)} · ${inc.minutes} min</div>
      <div class="s">${inc.time}${inc.trigger?' · '+esc(inc.trigger):''}</div></div>
      <button class="del">✕</button>`;
    row.querySelector('.del').addEventListener('click',()=>{ l.incidents.splice(i,1); render(); });
    c.appendChild(row);
  });
}

/* ---------- MODALE / DODAWANIE ---------- */
function openModal(title,html,onSave){
  const m=document.getElementById('modalContent');
  m.innerHTML=`<h3>${title}</h3>${html}
    <div class="btns"><button class="ghost" id="mCancel">Anuluj</button>
    <button class="primary" id="mOk">Zapisz</button></div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('mCancel').onclick=closeModal;
  document.getElementById('mOk').onclick=()=>{ if(onSave()!==false) closeModal(); };
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
const val=id=>document.getElementById(id)?.value.trim();

function addHabit(type){
  const titles={good:'Nowy nawyk',bad:'Nawyk do rzucenia',weekly:'Nawyk tygodniowy'};
  let extra = type==='weekly' ? `<label>Cel na tydzień (ile razy)</label><input id="mTarget" type="number" value="3" min="1" max="7">`:'';
  openModal(titles[type],`<label>Nazwa</label><input id="mName" placeholder="np. Medytacja">${extra}`,()=>{
    const n=val('mName'); if(!n) return false;
    const h={id:uid(),type,name:n};
    if(type==='weekly') h.target=+val('mTarget')||3;
    state.habits.push(h); render();
  });
}
function editHabit(h){
  openModal('Edytuj: '+h.name,`<label>Nazwa</label><input id="mName" value="${esc(h.name)}">
    ${h.type==='weekly'?`<label>Cel/tydzień</label><input id="mTarget" type="number" value="${h.target}">`:''}
    <button class="del" id="mDel" style="margin-top:14px;font-size:14px;">🗑 Usuń nawyk</button>`,()=>{
    h.name=val('mName')||h.name; if(h.type==='weekly') h.target=+val('mTarget')||h.target; render();
  });
  setTimeout(()=>{ const d=document.getElementById('mDel'); if(d) d.onclick=()=>{
    state.habits=state.habits.filter(x=>x.id!==h.id); closeModal(); render(); }; },0);
}
function addSupp(){
  openModal('Nowy suplement w stacku',`<label>Nazwa</label><input id="mName" placeholder="np. Kreatyna">
    <label>Domyślna godzina</label><input id="mTime" type="time" value="08:00">`,()=>{
    const n=val('mName'); if(!n) return false;
    state.supps.push({id:uid(),name:n,defaultTime:val('mTime')||'08:00'}); render();
  });
}
function editSupp(s){
  openModal('Edytuj: '+s.name,`<label>Nazwa</label><input id="mName" value="${esc(s.name)}">
    <label>Domyślna godzina</label><input id="mTime" type="time" value="${s.defaultTime}">
    <button class="del" id="mDel" style="margin-top:14px;font-size:14px;">🗑 Usuń ze stacku</button>`,()=>{
    s.name=val('mName')||s.name; s.defaultTime=val('mTime')||s.defaultTime; render();
  });
  setTimeout(()=>{ const d=document.getElementById('mDel'); if(d) d.onclick=()=>{
    state.supps=state.supps.filter(x=>x.id!==s.id); closeModal(); render(); }; },0);
}
function addIncident(){
  const presetBtns=DOPAMINE_PRESETS.map(p=>`<button type="button" class="pchip" data-v="${p}">${p}</button>`).join('');
  const trigBtns=TRIGGERS.map(t=>`<button type="button" class="tchip" data-v="${t}">${t}</button>`).join('');
  openModal('Co Cię wciągnęło?',`
    <label>Aplikacja / czynność</label>
    <input id="mName" placeholder="np. Instagram">
    <div class="seg" style="flex-wrap:wrap;margin-top:8px;">${presetBtns}</div>
    <div class="row" style="margin-top:6px;">
      <div><label>Ile minut</label><input id="mMin" type="number" value="20"></div>
      <div><label>Godzina</label><input id="mTime" type="time" value="${nowHM()}"></div>
    </div>
    <label>Co Cię pchnęło? (opcjonalnie)</label>
    <div class="seg" style="flex-wrap:wrap;">${trigBtns}</div>
    <input id="mTrig" type="hidden">`,()=>{
    const n=val('mName'); if(!n) return false;
    logFor(currentDate).incidents.push({id:uid(),name:n,minutes:+val('mMin')||0,time:val('mTime'),trigger:val('mTrig')});
    render();
  });
  setTimeout(()=>{
    document.querySelectorAll('.pchip').forEach(b=>b.onclick=()=>document.getElementById('mName').value=b.dataset.v);
    document.querySelectorAll('.tchip').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.tchip').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); document.getElementById('mTrig').value=b.dataset.v;
    });
  },0);
}
// styl chipów wstrzykiwany
const chipStyle=document.createElement('style');
chipStyle.textContent='.pchip,.tchip{padding:7px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12px;cursor:pointer;} .pchip:active,.tchip.on{background:var(--accent);color:#08101f;}';
document.head.appendChild(chipStyle);

document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.add;
  if(t==='supp') addSupp(); else if(t==='incident') addIncident(); else addHabit(t);
}));

/* ---------- NAWIGACJA ---------- */
document.getElementById('prevDay').onclick=()=>{ shiftDay(-1); };
document.getElementById('nextDay').onclick=()=>{ shiftDay(1); };
document.getElementById('todayBtn').onclick=()=>{ currentDate=todayISO(); render(); };
function shiftDay(n){ const d=new Date(currentDate); d.setDate(d.getDate()+n);
  const iso=d.toISOString().slice(0,10); if(iso>todayISO()) return; currentDate=iso; render(); }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('view-'+t.dataset.view).classList.add('active');
  if(t.dataset.view==='stats') renderStats();
}));

/* ---------- STATYSTYKI ---------- */
function renderStats(){
  const dates=Object.keys(state.logs).sort();
  // podstawowe liczby
  let totalDone=0, totalIncidents=0, totalScrollMin=0, daysLogged=0;
  dates.forEach(d=>{
    const l=state.logs[d];
    if(Object.keys(l.habits||{}).length||l.incidents?.length||Object.keys(l.ratings||{}).length) daysLogged++;
    Object.values(l.habits||{}).forEach(v=>{ if(v===true) totalDone++; });
    (l.incidents||[]).forEach(i=>{ totalIncidents++; totalScrollMin+=(+i.minutes||0); });
  });
  const bestGood=state.habits.filter(h=>h.type==='good').map(h=>goodStreak(h.id));
  const maxStreak=bestGood.length?Math.max(...bestGood):0;
  document.getElementById('statGrid').innerHTML=`
    <div class="stat-box"><div class="big">${maxStreak}🔥</div><div class="lbl">najlepszy streak</div></div>
    <div class="stat-box"><div class="big">${daysLogged}</div><div class="lbl">dni z danymi</div></div>
    <div class="stat-box"><div class="big">${totalIncidents}</div><div class="lbl">incydentów łącznie</div></div>
    <div class="stat-box"><div class="big">${Math.round(totalScrollMin/60*10)/10}h</div><div class="lbl">czas na scrollu</div></div>`;

  // kalendarz 30 dni
  const cal=document.getElementById('calGrid'); cal.innerHTML='';
  for(let i=29;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toISOString().slice(0,10);
    const l=state.logs[iso];
    const done=l?Object.values(l.habits||{}).filter(v=>v===true).length:0;
    const cell=document.createElement('div'); cell.className='cell';
    const intensity=Math.min(1,done/3);
    if(done>0) cell.style.background=`rgba(62,207,142,${.25+intensity*.6})`;
    cell.title=iso+' · '+done+' nawyków';
    cal.appendChild(cell);
  }

  // scroll wg godziny
  const hours=new Array(24).fill(0);
  dates.forEach(d=>(state.logs[d].incidents||[]).forEach(i=>{
    const h=parseInt((i.time||'12:00').slice(0,2)); hours[h]+=(+i.minutes||0);
  }));
  const maxH=Math.max(1,...hours);
  document.getElementById('hourBars').innerHTML=hours.map(v=>
    `<div class="b" style="height:${v/maxH*100}%" title="${v} min"></div>`).join('');

  renderCorrelations();
}

/* ---------- RADAR KORELACJI (automat) ---------- */
function pearson(pairs){
  const n=pairs.length; if(n<3) return null;
  const xs=pairs.map(p=>p[0]), ys=pairs.map(p=>p[1]);
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){ const a=xs[i]-mx,b=ys[i]-my; num+=a*b; dx+=a*a; dy+=b*b; }
  if(dx===0||dy===0) return null;
  return num/Math.sqrt(dx*dy);
}
// buduje serię dzienną danej metryki
function daySeries(){
  const dates=Object.keys(state.logs).sort();
  return dates.map(d=>{
    const l=state.logs[d]; const r=l.ratings||{};
    const scroll=(l.incidents||[]).reduce((a,i)=>a+(+i.minutes||0),0);
    const suppTaken=state.supps.filter(s=>l.supps?.[s.id]?.taken).length;
    return {date:d, sleepH:r.sleepH, work:r.work, energy:r.energy, self:r.self, scroll, suppTaken};
  });
}
// liczba treningów w oknie 7 dni kończącym się danego dnia (dla nawyków tygodniowych)
function weeklySeriesFor(habitId){
  const dates=Object.keys(state.logs).sort();
  return dates.map(d=>{
    let c=0; let dd=new Date(d);
    for(let i=0;i<7;i++){ const iso=dd.toISOString().slice(0,10);
      if(state.logs[iso]?.habits?.[habitId]===true) c++; dd.setDate(dd.getDate()-1); }
    return {date:d,count:c};
  });
}
const PAIRS=[
  {a:'sleepH',b:'work',txt:(r)=>`Im ${r>0?'więcej':'mniej'} śpisz, tym ${r>0?'lepiej':'gorzej'} oceniasz pracę`},
  {a:'sleepH',b:'energy',txt:(r)=>`Sen ${r>0?'podnosi':'obniża'} Twoją energię`},
  {a:'scroll',b:'self',txt:(r)=>`Więcej scrollowania idzie w parze z ${r>0?'lepszą':'gorszą'} oceną siebie`},
  {a:'scroll',b:'work',txt:(r)=>`Więcej scrollowania = ${r>0?'lepsza':'gorsza'} praca tego dnia`},
  {a:'suppTaken',b:'energy',txt:(r)=>`Wzięte suplementy a energia`},
];
function confLevel(n){ if(n>=21) return['high','dużo danych — całkiem pewne'];
  if(n>=10) return['mid','średnio danych — ostrożnie']; return['low','mało danych — tylko sygnał']; }

function renderCorrelations(){
  const box=document.getElementById('corrList'); box.innerHTML='';
  const series=daySeries();
  const found=[];
  PAIRS.forEach(p=>{
    const pairs=series.filter(s=>s[p.a]!=null&&s[p.b]!=null&&!(p.a==='scroll'&&s[p.a]===0&&s[p.b]==null))
      .map(s=>[s[p.a],s[p.b]]);
    const r=pearson(pairs);
    if(r!==null && Math.abs(r)>=0.25) found.push({p,r,n:pairs.length});
  });
  // korelacja treningi(7dni) -> praca
  const weeklyH=state.habits.find(h=>h.type==='weekly');
  if(weeklyH){
    const ws=weeklySeriesFor(weeklyH.id); const ser=daySeries();
    const map=Object.fromEntries(ser.map(s=>[s.date,s]));
    const pairs=ws.filter(w=>map[w.date]?.work!=null).map(w=>[w.count,map[w.date].work]);
    const r=pearson(pairs);
    if(r!==null&&Math.abs(r)>=0.25) found.push({custom:`Liczba treningów (${weeklyH.name}) w tygodniu a jakość pracy`,r,n:pairs.length});
  }
  found.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  if(!found.length){ box.innerHTML='<div class="empty">Za mało danych, żeby coś wyłapać. Klikaj codziennie kilka dni — radar sam się odezwie.</div>'; return; }
  found.forEach(f=>{
    const [cls,label]=confLevel(f.n);
    const head=f.custom?f.custom:f.p.txt(f.r);
    const arrow=f.r>0?'↗':'↘';
    const el=document.createElement('div'); el.className='corr';
    el.innerHTML=`<div class="headline">${arrow} <b>${head}.</b></div>
      <span class="conf ${cls}">${label} · ${f.n} dni · siła ${Math.abs(f.r).toFixed(2)}</span>`;
    box.appendChild(el);
  });
}

/* ---------- AI (symulacja przycisku) ---------- */
document.getElementById('aiBtn').addEventListener('click',()=>{
  const res=document.getElementById('aiResult');
  const series=daySeries();
  const withData=series.filter(s=>s.work!=null||s.energy!=null);
  res.innerHTML=`<div class="corr" style="border-color:var(--purple);">
    <div class="headline">✨ <b>Analiza AI (podgląd prototypu)</b></div>
    <div style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5;">
    W gotowej apce tu wejdzie prawdziwe AI. Dostanie Twoje ${withData.length} dni danych i poszuka
    złożonych układów: kombinacji (mało snu + dużo scrolla wieczorem → gorsza praca),
    efektów opóźnionych (dzień po treningu) i wzorców z Twoich notatek.
    Zawsze z etykietą „to hipoteza / ile danych", żeby nie wróżyć z fusów.</div>
    <div style="font-size:13px;margin-top:10px;">
    ${withData.length<7?'📉 Na razie masz za mało dni — nakarm apkę tydzień-dwa, a analiza będzie sensowna.':'✅ Masz już zaczątek danych — w wersji produkcyjnej to zapytanie poszłoby do modelu AI.'}
    </div></div>`;
});

/* ---------- util ---------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

render();
